          @Composable
          fun HeroActionCard(
              title: String,
              subtitle: String,
              icon: ImageVector,
              gradient: Brush,
              onClick: () -> Unit
          ) {
              Box(
                  modifier = Modifier
                      .fillMaxWidth()
                      .clip(RoundedCornerShape(26.dp))
                      .background(gradient)
                      .clickable(onClick = onClick)
                      .padding(24.dp)
              ) {
                  Row(
                      verticalAlignment = Alignment.CenterVertically,
                      horizontalArrangement = Arrangement.SpaceBetween,
                      modifier = Modifier.fillMaxWidth()
                  ) {
                      Column(modifier = Modifier.weight(1f)) {
                          Text(
                              text = title,
                              fontSize = 24.sp,
                              fontWeight = FontWeight.ExtraBold,
                              color = Color.White
                          )
                          Spacer(modifier = Modifier.height(6.dp))
                          Text(
                              text = subtitle,
                              fontSize = 14.sp,
                              color = Color.White.copy(alpha = 0.9f),
                              lineHeight = 20.sp
                          )
                      }
                      Spacer(modifier = Modifier.width(16.dp))
                      Box(
                          modifier = Modifier
                              .size(64.dp)
                              .clip(CircleShape)
                              .background(Color.White.copy(alpha = 0.22f)),
                          contentAlignment = Alignment.Center
                      ) {
                          Icon(
                              imageVector = icon,
                              contentDescription = title,
                              tint = Color.White,
                              modifier = Modifier.size(34.dp)
                          )
                      }
                  }
              }
          }

          @Composable
          fun SettingsScreenContent(
              strings: LocalizedStrings,
              currentLanguage: AppLanguage,
              onLanguageChange: (AppLanguage) -> Unit,
              isDarkMode: Boolean,
              onThemeToggle: (Boolean) -> Unit,
              deviceName: String,
              onDeviceNameChange: (String) -> Unit,
              onOpenHelp: () -> Unit
          ) {
              Column(
                  modifier = Modifier
                      .fillMaxSize()
                      .verticalScroll(rememberScrollState())
                      .padding(20.dp),
                  verticalArrangement = Arrangement.spacedBy(16.dp)
              ) {
                  Text(
                      text = strings.navSettings,
                      fontSize = 24.sp,
                      fontWeight = FontWeight.Bold
                  )

                  OutlinedTextField(
                      value = deviceName,
                      onValueChange = onDeviceNameChange,
                      label = { Text(strings.deviceNameLabel) },
                      singleLine = true,
                      modifier = Modifier.fillMaxWidth(),
                      shape = RoundedCornerShape(14.dp)
                  )

                  Card(shape = RoundedCornerShape(16.dp)) {
                      Column(modifier = Modifier.padding(16.dp)) {
                          Text(text = strings.languageSettingTitle, fontWeight = FontWeight.Bold)
                          Spacer(modifier = Modifier.height(10.dp))
                          Row(horizontalArrangement = Arrangement.spacedBy(12.dp)) {
                              FilterChip(
                                  selected = currentLanguage == AppLanguage.HINDI,
                                  onClick = { onLanguageChange(AppLanguage.HINDI) },
                                  label = { Text("हिंदी (डिफ़ॉल्ट)") }
                              )
                              FilterChip(
                                  selected = currentLanguage == AppLanguage.ENGLISH,
                                  onClick = { onLanguageChange(AppLanguage.ENGLISH) },
                                  label = { Text("English") }
                              )
                          }
                      }
                  }

                  Card(shape = RoundedCornerShape(16.dp)) {
                      Row(
                          modifier = Modifier
                              .fillMaxWidth()
                              .padding(16.dp),
                          verticalAlignment = Alignment.CenterVertically,
                          horizontalArrangement = Arrangement.SpaceBetween
                      ) {
                          Column {
                              Text(text = strings.themeSettingTitle, fontWeight = FontWeight.Bold)
                              Text(
                                  text = if (isDarkMode) strings.darkModeLabel else strings.lightModeLabel,
                                  fontSize = 13.sp,
                                  color = MaterialTheme.colorScheme.onSurfaceVariant
                              )
                          }
                          Switch(checked = isDarkMode, onCheckedChange = onThemeToggle)
                      }
                  }

                  OutlinedButton(
                      onClick = onOpenHelp,
                      modifier = Modifier.fillMaxWidth(),
                      shape = RoundedCornerShape(14.dp)
                  ) {
                      Icon(Icons.Default.HelpOutline, contentDescription = null)
                      Spacer(modifier = Modifier.width(8.dp))
                      Text(strings.helpAndTroubleshooting)
                  }
              }
          }

          @Composable
          fun HelpScreenContent(
              currentLanguage: AppLanguage,
              onBack: () -> Unit
          ) {
              Column(
                  modifier = Modifier
                      .fillMaxSize()
                      .verticalScroll(rememberScrollState())
                      .padding(20.dp),
                  verticalArrangement = Arrangement.spacedBy(14.dp)
              ) {
                  TextButton(onClick = onBack) {
                      Icon(Icons.Default.ArrowBack, contentDescription = null)
                      Spacer(modifier = Modifier.width(6.dp))
                      Text(if (currentLanguage == AppLanguage.HINDI) "वापस जाएं" else "Back")
                  }
                  Text(
                      text = if (currentLanguage == AppLanguage.HINDI) "सहायता और समस्या निवारण" else "Help & Troubleshooting",
                      fontSize = 22.sp,
                      fontWeight = FontWeight.Bold
                  )
                  Card(shape = RoundedCornerShape(16.dp)) {
                      Column(modifier = Modifier.padding(16.dp), verticalArrangement = Arrangement.spacedBy(8.dp)) {
                          Text(
                              text = if (currentLanguage == AppLanguage.HINDI)
                                  "1. आस-पास के फ़ोन क्यों नहीं दिख रहे?"
                              else
                                  "1. Why are nearby devices not showing up?",
                              fontWeight = FontWeight.Bold
                          )
                          Text(
                              text = if (currentLanguage == AppLanguage.HINDI)
                                  "दोनों फ़ोन में Wi-Fi चालू होना चाहिए (इंटरनेट ज़रूरी नहीं है)। यदि आपका फ़ोन Android 12 या उससे पुराना है, तो GPS/Location चालू करना एंड्रॉइड सिस्टम के नियम के अनुसार अनिवार्य है।"
                              else
                                  "Both phones must have Wi-Fi enabled (internet is not needed). On Android 12 and below, Location/GPS must be turned ON for Wi-Fi Direct discovery."
                          )
                      }
                  }
              }
          }

          @Composable
          fun MilestonePlaceholderScreen(
              title: String,
              subtitle: String,
              icon: ImageVector,
              onBack: () -> Unit
          ) {
              Column(
                  modifier = Modifier
                      .fillMaxSize()
                      .padding(24.dp),
                  verticalArrangement = Arrangement.Center,
                  horizontalAlignment = Alignment.CenterHorizontally
              ) {
                  Icon(
                      imageVector = icon,
                      contentDescription = null,
                      tint = MaterialTheme.colorScheme.primary,
                      modifier = Modifier.size(64.dp)
                  )
                  Spacer(modifier = Modifier.height(16.dp))
                  Text(text = title, fontSize = 22.sp, fontWeight = FontWeight.Bold)
                  Spacer(modifier = Modifier.height(10.dp))
                  Text(
                      text = subtitle,
                      textAlign = TextAlign.Center,
                      color = MaterialTheme.colorScheme.onSurfaceVariant
                  )
                  Spacer(modifier = Modifier.height(24.dp))
                  Button(onClick = onBack, shape = RoundedCornerShape(12.dp)) {
                      Icon(Icons.Default.ArrowBack, contentDescription = null)
                      Spacer(modifier = Modifier.width(8.dp))
                      Text("होम पर लौटें / Back to Home")
                  }
              }
          }
          EOF_MAIN

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.6
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.6'

      - name: Build Debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload Ready-to-Install APK
        uses: actions/upload-artifact@v4
        with:
          name: FileBridge-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error


name: Build FileBridge Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Compile Native Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Auto-Repair Project Structure and Files
        run: |
          rm -rf "(app" app gradlew gradlew.bat
          mkdir -p app/src/main/java/com/filebridge/p2p/ui/theme

          cat << 'EOF_SETTINGS' > settings.gradle.kts
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "FileBridge"
          include(":app")
          EOF_SETTINGS

          cat << 'EOF_ROOT_GRADLE' > build.gradle.kts
          plugins {
              id("com.android.application") version "8.2.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.22" apply false
          }
          EOF_ROOT_GRADLE

          cat << 'EOF_PROPS' > gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          android.nonTransitiveRClass=true
          EOF_PROPS

          cat << 'EOF_APP_GRADLE' > app/build.gradle.kts
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.filebridge.p2p"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.filebridge.p2p"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0.0-milestone1"

                  vectorDrawables {
                      useSupportLibrary = true
                  }
              }

              buildTypes {
                  release {
                      isMinifyEnabled = false
                  }
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }

              buildFeatures {
                  compose = true
              }

              composeOptions {
                  kotlinCompilerExtensionVersion = "1.5.10"
              }

              packaging {
                  resources {
                      excludes += "/META-INF/{AL2.0,LGPL2.1}"
                  }
              }
          }

          dependencies {
              implementation("androidx.core:core-ktx:1.12.0")
              implementation("androidx.lifecycle:lifecycle-runtime-ktx:2.7.0")
              implementation("androidx.activity:activity-compose:1.8.2")
              implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3")

              val composeBom = platform("androidx.compose:compose-bom:2024.02.01")
              implementation(composeBom)

              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.ui:ui-graphics")
              implementation("androidx.compose.ui:ui-tooling-preview")
              implementation("androidx.compose.material3:material3")
              implementation("androidx.compose.material:material-icons-extended")
              implementation("androidx.navigation:navigation-compose:2.7.7")
              implementation("androidx.documentfile:documentfile:1.0.1")
              implementation("com.google.zxing:core:3.5.3")
          }
          EOF_APP_GRADLE

          cat << 'EOF_MANIFEST' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:tools="http://schemas.android.com/tools">

              <uses-permission android:name="android.permission.ACCESS_WIFI_STATE" />
              <uses-permission android:name="android.permission.CHANGE_WIFI_STATE" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.CHANGE_NETWORK_STATE" />
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission
                  android:name="android.permission.NEARBY_WIFI_DEVICES"
                  android:usesPermissionFlags="neverForLocation"
                  tools:targetApi="s" />
              <uses-permission
                  android:name="android.permission.ACCESS_FINE_LOCATION"
                  android:maxSdkVersion="32" />
              <uses-permission
                  android:name="android.permission.ACCESS_COARSE_LOCATION"
                  android:maxSdkVersion="32" />
              <uses-permission android:name="android.permission.CAMERA" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_DATA_SYNC" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />

              <uses-feature android:name="android.hardware.wifi.direct" android:required="true" />
              <uses-feature android:name="android.hardware.camera" android:required="false" />

              <application
                  android:allowBackup="false"
                  android:label="FileBridge"
                  android:supportsRtl="true"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar"
                  tools:targetApi="34">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|screenLayout|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF_MANIFEST

          cat << 'EOF_THEME' > app/src/main/java/com/filebridge/p2p/ui/theme/ThemeAndStrings.kt
          package com.filebridge.p2p.ui.theme

          import androidx.compose.foundation.isSystemInDarkTheme
          import androidx.compose.material3.MaterialTheme
          import androidx.compose.material3.darkColorScheme
          import androidx.compose.material3.lightColorScheme
          import androidx.compose.runtime.Composable
          import androidx.compose.runtime.Immutable
          import androidx.compose.ui.graphics.Brush
          import androidx.compose.ui.graphics.Color

          object AppBranding {
              const val APP_NAME = "FileBridge"
              const val PACKAGE_NAME = "com.filebridge.p2p"
              const val VERSION_NAME = "1.0.0 (Milestone 1)"

              val PrimaryBlue = Color(0xFF2563EB)
              val DeepIndigo = Color(0xFF4F46E5)
              val VibrantPurple = Color(0xFF7C3AED)
              val AccentCyan = Color(0xFF06B6D4)
              val EmeraldSuccess = Color(0xFF10B981)
              val AmberWarning = Color(0xFFF59E0B)
              val RoseError = Color(0xFFF43F5E)

              val PrimaryGradientBrush = Brush.linearGradient(
                  colors = listOf(PrimaryBlue, DeepIndigo, VibrantPurple)
              )

              val SendCardGradient = Brush.linearGradient(
                  colors = listOf(Color(0xFF2563EB), Color(0xFF4F46E5))
              )

              val ReceiveCardGradient = Brush.linearGradient(
                  colors = listOf(Color(0xFF7C3AED), Color(0xFF9333EA))
              )
          }

          private val DarkColorPalette = darkColorScheme(
              primary = Color(0xFF60A5FA),
              onPrimary = Color(0xFF0F172A),
              primaryContainer = Color(0xFF1E3A8A),
              onPrimaryContainer = Color(0xFFDBEAFE),
              secondary = Color(0xFFA78BFA),
              onSecondary = Color(0xFF1E1B4B),
              secondaryContainer = Color(0xFF4C1D95),
              onSecondaryContainer = Color(0xFFEDE9FE),
              background = Color(0xFF0B0F19),
              onBackground = Color(0xFFF8FAFC),
              surface = Color(0xFF151C2C),
              onSurface = Color(0xFFF1F5F9),
              surfaceVariant = Color(0xFF1E293B),
              onSurfaceVariant = Color(0xFF94A3B8)
          )

          private val LightColorPalette = lightColorScheme(
              primary = AppBranding.PrimaryBlue,
              onPrimary = Color.White,
              primaryContainer = Color(0xFFDBEAFE),
              onPrimaryContainer = Color(0xFF1E3A8A),
              secondary = AppBranding.VibrantPurple,
              onSecondary = Color.White,
              secondaryContainer = Color(0xFFEDE9FE),
              onSecondaryContainer = Color(0xFF4C1D95),
              background = Color(0xFFF8FAFC),
              onBackground = Color(0xFF0F172A),
              surface = Color.White,
              onSurface = Color(0xFF0F172A),
              surfaceVariant = Color(0xFFF1F5F9),
              onSurfaceVariant = Color(0xFF475569)
          )

          @Composable
          fun FileBridgeTheme(
              darkTheme: Boolean = isSystemInDarkTheme(),
              content: @Composable () -> Unit
          ) {
              val colorScheme = if (darkTheme) DarkColorPalette else LightColorPalette
              MaterialTheme(
                  colorScheme = colorScheme,
                  content = content
              )
          }

          enum class AppLanguage {
              HINDI, ENGLISH
          }

          @Immutable
          data class LocalizedStrings(
              val appTagline: String,
              val introTitle: String,
              val introSubtitle: String,
              val getStartedBtn: String,
              val sendButtonTitle: String,
              val sendButtonSubtitle: String,
              val receiveButtonTitle: String,
              val receiveButtonSubtitle: String,
              val navHome: String,
              val navNearby: String,
              val navHistory: String,
              val navSettings: String,
              val securityBadgeText: String,
              val offlineReadyText: String,
              val quickQrPair: String,
              val deviceNameLabel: String,
              val languageSettingTitle: String,
              val themeSettingTitle: String,
              val darkModeLabel: String,
              val lightModeLabel: String,
              val helpAndTroubleshooting: String,
              val milestoneBannerTitle: String,
              val milestoneBannerDesc: String
          )

          object AppStringsProvider {
              val hindi = LocalizedStrings(
                  appTagline = "तेज़, सुरक्षित और बिना इंटरनेट फ़ाइल शेयरिंग",
                  introTitle = "FileBridge में आपका स्वागत है",
                  introSubtitle = "बिना इंटरनेट या मोबाइल डेटा खर्च किए, सीधे एक एंड्रॉइड फ़ोन से दूसरे फ़ोन में फ़ोटो, वीडियो और बड़ी फ़ाइलें सुरक्षित रूप से भेजें।",
                  getStartedBtn = "शुरू करें (Get Started)",
                  sendButtonTitle = "फ़ाइल भेजें (SEND)",
                  sendButtonSubtitle = "फ़ोटो, वीडियो, PDF या कोई भी फ़ाइल चुनें",
                  receiveButtonTitle = "प्राप्त करें (RECEIVE)",
                  receiveButtonSubtitle = "पास के फ़ोन से फ़ाइल लेने के लिए तैयार रहें",
                  navHome = "होम",
                  navNearby = "आस-पास",
                  navHistory = "इतिहास",
                  navSettings = "सेटिंग्स",
                  securityBadgeText = "AES-256 एन्क्रिप्टेड • SHA-256 सत्यापित",
                  offlineReadyText = "100% ऑफ़लाइन P2P (Wi-Fi Direct एवं QR)",
                  quickQrPair = "QR कोड से तुरंत जोड़ें",
                  deviceNameLabel = "आपका डिवाइस नाम:",
                  languageSettingTitle = "भाषा चुनें (Language)",
                  themeSettingTitle = "दिखावट (Theme Mode)",
                  darkModeLabel = "डार्क मोड (Dark)",
                  lightModeLabel = "लाइट मोड (Light)",
                  helpAndTroubleshooting = "सहायता और समस्या निवारण (Help)",
                  milestoneBannerTitle = "माइलस्टोन 1 सक्रिय है",
                  milestoneBannerDesc = "होम स्क्रीन, नेविगेशन, थीम और द्विभाषी इंजन तैयार है। अगले चरण में असली फ़ाइल पिकर और Wi-Fi Direct जुड़ेगा।"
              )

              val english = LocalizedStrings(
                  appTagline = "Fast, Secure & Offline P2P File Sharing",
                  introTitle = "Welcome to FileBridge",
                  introSubtitle = "Transfer photos, videos, and large files directly between Android devices without internet or mobile data.",
                  getStartedBtn = "Get Started",
                  sendButtonTitle = "SEND FILES",
                  sendButtonSubtitle = "Select photos, videos, PDFs, or any document",
                  receiveButtonTitle = "RECEIVE FILES",
                  receiveButtonSubtitle = "Make this phone visible to receive files",
                  navHome = "Home",
                  navNearby = "Nearby",
                  navHistory = "History",
                  navSettings = "Settings",
                  securityBadgeText = "AES-256 Encrypted • SHA-256 Verified",
                  offlineReadyText = "100% Offline P2P (Wi-Fi Direct & QR)",
                  quickQrPair = "Quick Connect via QR Code",
                  deviceNameLabel = "Your Device Name:",
                  languageSettingTitle = "Select Language",
                  themeSettingTitle = "Appearance (Theme Mode)",
                  darkModeLabel = "Dark Mode",
                  lightModeLabel = "Light Mode",
                  helpAndTroubleshooting = "Help & Troubleshooting",
                  milestoneBannerTitle = "Milestone 1 Active",
                  milestoneBannerDesc = "Home UI, navigation, theming, and bilingual engine are live. Next milestone adds real SAF file picker & Wi-Fi Direct."
              )

              fun get(language: AppLanguage): LocalizedStrings {
                  return when (language) {
                      AppLanguage.HINDI -> hindi
                      AppLanguage.ENGLISH -> english
                  }
              }
          }
          EOF_THEME

          cat << 'EOF_MAIN' > app/src/main/java/com/filebridge/p2p/MainActivity.kt
          @file:OptIn(ExperimentalMaterial3Api::class)
          package com.filebridge.p2p

          import android.os.Build
          import android.os.Bundle
          import androidx.activity.ComponentActivity
          import androidx.activity.compose.setContent
          import androidx.compose.foundation.background
          import androidx.compose.foundation.clickable
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.rememberScrollState
          import androidx.compose.foundation.shape.CircleShape
          import androidx.compose.foundation.shape.RoundedCornerShape
          import androidx.compose.foundation.verticalScroll
          import androidx.compose.material.icons.Icons
          import androidx.compose.material.icons.filled.*
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.draw.clip
          import androidx.compose.ui.graphics.Brush
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.graphics.vector.ImageVector
          import androidx.compose.ui.text.font.FontWeight
          import androidx.compose.ui.text.style.TextAlign
          import androidx.compose.ui.unit.dp
          import androidx.compose.ui.unit.sp
          import com.filebridge.p2p.ui.theme.*
          import kotlinx.coroutines.delay

          enum class AppScreen {
              SPLASH,
              INTRO,
              HOME,
              SEND_PREPARATION,
              RECEIVE_PREPARATION,
              NEARBY_DEVICES,
              TRANSFER_HISTORY,
              SETTINGS,
              HELP
          }

          class MainActivity : ComponentActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  val defaultDeviceName = "${Build.MANUFACTURER.replaceFirstChar { it.uppercase() }} ${Build.MODEL}"

                  setContent {
                      var currentLanguage by remember { mutableStateOf(AppLanguage.HINDI) }
                      var isDarkMode by remember { mutableStateOf(true) }
                      var showFirstTimeIntro by remember { mutableStateOf(true) }
                      var currentScreen by remember { mutableStateOf(AppScreen.SPLASH) }
                      var customDeviceName by remember { mutableStateOf(defaultDeviceName) }

                      val strings = AppStringsProvider.get(currentLanguage)

                      LaunchedEffect(Unit) {
                          delay(1400)
                          currentScreen = if (showFirstTimeIntro) AppScreen.INTRO else AppScreen.HOME
                      }

                      FileBridgeTheme(darkTheme = isDarkMode) {
                          Surface(
                              modifier = Modifier.fillMaxSize(),
                              color = MaterialTheme.colorScheme.background
                          ) {
                              when (currentScreen) {
                                  AppScreen.SPLASH -> SplashScreen(strings)
                                  AppScreen.INTRO -> FirstTimeIntroScreen(
                                      strings = strings,
                                      currentLanguage = currentLanguage,
                                      onLanguageToggle = {
                                          currentLanguage = if (currentLanguage == AppLanguage.HINDI) AppLanguage.ENGLISH else AppLanguage.HINDI
                                      },
                                      onContinue = {
                                          showFirstTimeIntro = false
                                          currentScreen = AppScreen.HOME
                                      }
                                  )
                                  else -> MainScaffoldContainer(
                                      currentScreen = currentScreen,
                                      onNavigate = { currentScreen = it },
                                      strings = strings,
                                      currentLanguage = currentLanguage,
                                      onLanguageChange = { currentLanguage = it },
                                      isDarkMode = isDarkMode,
                                      onThemeToggle = { isDarkMode = it },
                                      deviceName = customDeviceName,
                                      onDeviceNameChange = { customDeviceName = it }
                                  )
                              }
                          }
                      }
                  }
              }
          }

          @Composable
          fun SplashScreen(strings: LocalizedStrings) {
              Box(
                  modifier = Modifier
                      .fillMaxSize()
                      .background(AppBranding.PrimaryGradientBrush),
                  contentAlignment = Alignment.Center
              ) {
                  Column(
                      horizontalAlignment = Alignment.CenterHorizontally,
                      modifier = Modifier.padding(24.dp)
                  ) {
                      Box(
                          modifier = Modifier
                              .size(96.dp)
                              .clip(RoundedCornerShape(28.dp))
                              .background(Color.White.copy(alpha = 0.18f)),
                          contentAlignment = Alignment.Center
                      ) {
                          Icon(
                              imageVector = Icons.Default.SwapHoriz,
                              contentDescription = AppBranding.APP_NAME,
                              tint = Color.White,
                              modifier = Modifier.size(56.dp)
                          )
                      }
                      Spacer(modifier = Modifier.height(20.dp))
                      Text(
                          text = AppBranding.APP_NAME,
                          fontSize = 34.sp,
                          fontWeight = FontWeight.ExtraBold,
                          color = Color.White
                      )
                      Spacer(modifier = Modifier.height(8.dp))
                      Text(
                          text = strings.appTagline,
                          fontSize = 15.sp,
                          color = Color.White.copy(alpha = 0.85f),
                          textAlign = TextAlign.Center
                      )
                  }
              }
          }

          @Composable
          fun FirstTimeIntroScreen(
              strings: LocalizedStrings,
              currentLanguage: AppLanguage,
              onLanguageToggle: () -> Unit,
              onContinue: () -> Unit
          ) {
              Column(
                  modifier = Modifier
                      .fillMaxSize()
                      .padding(24.dp),
                  verticalArrangement = Arrangement.SpaceBetween,
                  horizontalAlignment = Alignment.CenterHorizontally
              ) {
                  Row(
                      modifier = Modifier.fillMaxWidth(),
                      horizontalArrangement = Arrangement.End
                  ) {
                      OutlinedButton(
                          onClick = onLanguageToggle,
                          shape = RoundedCornerShape(50)
                      ) {
                          Icon(Icons.Default.Language, contentDescription = null, modifier = Modifier.size(18.dp))
                          Spacer(modifier = Modifier.width(6.dp))
                          Text(if (currentLanguage == AppLanguage.HINDI) "English" else "हिंदी")
                      }
                  }

                  Column(
                      horizontalAlignment = Alignment.CenterHorizontally,
                      modifier = Modifier.padding(horizontal = 12.dp)
                  ) {
                      Box(
                          modifier = Modifier
                              .size(110.dp)
                              .clip(CircleShape)
                              .background(AppBranding.PrimaryGradientBrush),
                          contentAlignment = Alignment.Center
                      ) {
                          Icon(
                              imageVector = Icons.Default.WifiTethering,
                              contentDescription = null,
                              tint = Color.White,
                              modifier = Modifier.size(54.dp)
                          )
                      }
                      Spacer(modifier = Modifier.height(28.dp))
                      Text(
                          text = strings.introTitle,
                          fontSize = 26.sp,
                          fontWeight = FontWeight.Bold,
                          textAlign = TextAlign.Center,
                          color = MaterialTheme.colorScheme.onBackground
                      )
                      Spacer(modifier = Modifier.height(14.dp))
                      Text(
                          text = strings.introSubtitle,
                          fontSize = 16.sp,
                          textAlign = TextAlign.Center,
                          color = MaterialTheme.colorScheme.onSurfaceVariant,
                          lineHeight = 24.sp
                      )
                      Spacer(modifier = Modifier.height(24.dp))

                      Card(
                          shape = RoundedCornerShape(16.dp),
                          colors = CardDefaults.cardColors(containerColor = MaterialTheme.colorScheme.surfaceVariant)
                      ) {
                          Row(
                              modifier = Modifier.padding(horizontal = 16.dp, vertical = 12.dp),
                              verticalAlignment = Alignment.CenterVertically
                          ) {
                              Icon(
                                  imageVector = Icons.Default.VerifiedUser,
                                  contentDescription = null,
                                  tint = AppBranding.EmeraldSuccess
                              )
                              Spacer(modifier = Modifier.width(10.dp))
                              Text(
                                  text = strings.securityBadgeText,
                                  fontSize = 13.sp,
                                  fontWeight = FontWeight.SemiBold
                              )
                          }
                      }
                  }

                  Button(
                      onClick = onContinue,
                      modifier = Modifier
                          .fillMaxWidth()
                          .height(56.dp),
                      shape = RoundedCornerShape(18.dp),
                      colors = ButtonDefaults.buttonColors(containerColor = AppBranding.PrimaryBlue)
                  ) {
                      Text(
                          text = strings.getStartedBtn,
                          fontSize = 17.sp,
                          fontWeight = FontWeight.Bold,
                          color = Color.White
                      )
                      Spacer(modifier = Modifier.width(8.dp))
                      Icon(Icons.Default.ArrowForward, contentDescription = null, tint = Color.White)
                  }
              }
          }

          @Composable
          fun MainScaffoldContainer(
              currentScreen: AppScreen,
              onNavigate: (AppScreen) -> Unit,
              strings: LocalizedStrings,
              currentLanguage: AppLanguage,
              onLanguageChange: (AppLanguage) -> Unit,
              isDarkMode: Boolean,
              onThemeToggle: (Boolean) -> Unit,
              deviceName: String,
              onDeviceNameChange: (String) -> Unit
          ) {
              Scaffold(
                  topBar = {
                      TopAppBar(
                          title = {
                              Row(verticalAlignment = Alignment.CenterVertically) {
                                  Box(
                                      modifier = Modifier
                                          .size(36.dp)
                                          .clip(RoundedCornerShape(10.dp))
                                          .background(AppBranding.PrimaryGradientBrush),
                                      contentAlignment = Alignment.Center
                                  ) {
                                      Icon(
                                          imageVector = Icons.Default.SwapHoriz,
                                          contentDescription = null,
                                          tint = Color.White,
                                          modifier = Modifier.size(22.dp)
                                      )
                                  }
                                  Spacer(modifier = Modifier.width(10.dp))
                                  Column {
                                      Text(
                                          text = AppBranding.APP_NAME,
                                          fontWeight = FontWeight.Bold,
                                          fontSize = 19.sp
                                      )
                                      Text(
                                          text = strings.offlineReadyText,
                                          fontSize = 11.sp,
                                          color = MaterialTheme.colorScheme.onSurfaceVariant
                                      )
                                  }
                              }
                          },
                          actions = {
                              TextButton(
                                  onClick = {
                                      onLanguageChange(
                                          if (currentLanguage == AppLanguage.HINDI) AppLanguage.ENGLISH else AppLanguage.HINDI
                                      )
                                  }
                              ) {
                                  Text(
                                      text = if (currentLanguage == AppLanguage.HINDI) "EN" else "हिंदी",
                                      fontWeight = FontWeight.Bold
                                  )
                              }
                              IconButton(onClick = { onThemeToggle(!isDarkMode) }) {
                                  Icon(
                                      imageVector = if (isDarkMode) Icons.Default.LightMode else Icons.Default.DarkMode,
                                      contentDescription = "Toggle Theme"
                                  )
                              }
                          }
                      )
                  },
                  bottomBar = {
                      NavigationBar {
                          NavigationBarItem(
                              selected = currentScreen == AppScreen.HOME ||
                                      currentScreen == AppScreen.SEND_PREPARATION ||
                                      currentScreen == AppScreen.RECEIVE_PREPARATION,
                              onClick = { onNavigate(AppScreen.HOME) },
                              icon = { Icon(Icons.Default.Home, contentDescription = strings.navHome) },
                              label = { Text(strings.navHome) }
                          )
                          NavigationBarItem(
                              selected = currentScreen == AppScreen.NEARBY_DEVICES,
                              onClick = { onNavigate(AppScreen.NEARBY_DEVICES) },
                              icon = { Icon(Icons.Default.Radar, contentDescription = strings.navNearby) },
                              label = { Text(strings.navNearby) }
                          )
                          NavigationBarItem(
                              selected = currentScreen == AppScreen.TRANSFER_HISTORY,
                              onClick = { onNavigate(AppScreen.TRANSFER_HISTORY) },
                              icon = { Icon(Icons.Default.History, contentDescription = strings.navHistory) },
                              label = { Text(strings.navHistory) }
                          )
                          NavigationBarItem(
                              selected = currentScreen == AppScreen.SETTINGS || currentScreen == AppScreen.HELP,
                              onClick = { onNavigate(AppScreen.SETTINGS) },
                              icon = { Icon(Icons.Default.Settings, contentDescription = strings.navSettings) },
                              label = { Text(strings.navSettings) }
                          )
                      }
                  }
              ) { innerPadding ->
                  Box(
                      modifier = Modifier
                          .fillMaxSize()
                          .padding(innerPadding)
                  ) {
                      when (currentScreen) {
                          AppScreen.HOME -> HomeScreenContent(
                              strings = strings,
                              deviceName = deviceName,
                              onSendClick = { onNavigate(AppScreen.SEND_PREPARATION) },
                              onReceiveClick = { onNavigate(AppScreen.RECEIVE_PREPARATION) },
                              onNearbyClick = { onNavigate(AppScreen.NEARBY_DEVICES) }
                          )
                          AppScreen.SEND_PREPARATION -> MilestonePlaceholderScreen(
                              title = strings.sendButtonTitle,
                              subtitle = if (currentLanguage == AppLanguage.HINDI)
                                  "यह स्क्रीन Milestone 2 में Android Storage Access Framework (SAF) से जुड़ेगी ताकि आप असली फ़ोटो, वीडियो, PDF और ZIP चुन सकें।"
                              else
                                  "This screen connects to Android's native Storage Access Framework (SAF) in Milestone 2 to pick real files.",
                              icon = Icons.Default.UploadFile,
                              onBack = { onNavigate(AppScreen.HOME) }
                          )
                          AppScreen.RECEIVE_PREPARATION -> MilestonePlaceholderScreen(
                              title = strings.receiveButtonTitle,
                              subtitle = if (currentLanguage == AppLanguage.HINDI)
                                  "यह स्क्रीन Milestone 2 और 3 में आपके फ़ोन पर लोकल Wi-Fi Direct रिसीवर और QR कोड चालू करेगी।"
                              else
                                  "This screen activates the local Wi-Fi Direct receiver and QR code generator in Milestones 2 & 3.",
                              icon = Icons.Default.Download,
                              onBack = { onNavigate(AppScreen.HOME) }
                          )
                          AppScreen.NEARBY_DEVICES -> MilestonePlaceholderScreen(
                              title = strings.navNearby,
                              subtitle = if (currentLanguage == AppLanguage.HINDI)
                                  "Milestone 3 में यहाँ WifiP2pManager के ज़रिए आस-पास के असली एंड्रॉइड फ़ोनों की लाइव सूची दिखेगी।"
                              else
                                  "In Milestone 3, real nearby Android devices discovered via WifiP2pManager will appear here.",
                              icon = Icons.Default.Radar,
                              onBack = { onNavigate(AppScreen.HOME) }
                          )
                          AppScreen.TRANSFER_HISTORY -> MilestonePlaceholderScreen(
                              title = strings.navHistory,
                              subtitle = if (currentLanguage == AppLanguage.HINDI)
                                  "Milestone 6 में यहाँ Room Database से भेजी और प्राप्त की गई फ़ाइलों का पूरा रिकॉर्ड दिखेगा।"
                              else
                                  "In Milestone 6, sent and received file history backed by Room SQLite database will appear here.",
                              icon = Icons.Default.History,
                              onBack = { onNavigate(AppScreen.HOME) }
                          )
                          AppScreen.SETTINGS -> SettingsScreenContent(
                              strings = strings,
                              currentLanguage = currentLanguage,
                              onLanguageChange = onLanguageChange,
                              isDarkMode = isDarkMode,
                              onThemeToggle = onThemeToggle,
                              deviceName = deviceName,
                              onDeviceNameChange = onDeviceNameChange,
                              onOpenHelp = { onNavigate(AppScreen.HELP) }
                          )
                          AppScreen.HELP -> HelpScreenContent(
                              currentLanguage = currentLanguage,
                              onBack = { onNavigate(AppScreen.SETTINGS) }
                          )
                          else -> {}
                      }
                  }
              }
          }

          @Composable
          fun HomeScreenContent(
              strings: LocalizedStrings,
              deviceName: String,
              onSendClick: () -> Unit,
              onReceiveClick: () -> Unit,
              onNearbyClick: () -> Unit
          ) {
              Column(
                  modifier = Modifier
                      .fillMaxSize()
                      .verticalScroll(rememberScrollState())
                      .padding(20.dp),
                  verticalArrangement = Arrangement.spacedBy(18.dp)
              ) {
                  Card(
                      shape = RoundedCornerShape(18.dp),
                      colors = CardDefaults.cardColors(containerColor = MaterialTheme.colorScheme.surfaceVariant)
                  ) {
                      Row(
                          modifier = Modifier
                              .fillMaxWidth()
                              .padding(16.dp),
                          verticalAlignment = Alignment.CenterVertically,
                          horizontalArrangement = Arrangement.SpaceBetween
                      ) {
                          Row(verticalAlignment = Alignment.CenterVertically) {
                              Icon(
                                  imageVector = Icons.Default.Smartphone,
                                  contentDescription = null,
                                  tint = MaterialTheme.colorScheme.primary
                              )
                              Spacer(modifier = Modifier.width(12.dp))
                              Column {
                                  Text(
                                      text = strings.deviceNameLabel,
                                      fontSize = 12.sp,
                                      color = MaterialTheme.colorScheme.onSurfaceVariant
                                  )
                                  Text(
                                      text = deviceName,
                                      fontSize = 16.sp,
                                      fontWeight = FontWeight.Bold,
                                      color = MaterialTheme.colorScheme.onSurface
                                  )
                              }
                          }
                          Surface(
                              shape = RoundedCornerShape(50),
                              color = AppBranding.EmeraldSuccess.copy(alpha = 0.15f)
                          ) {
                              Text(
                                  text = "P2P Ready",
                                  color = AppBranding.EmeraldSuccess,
                                  fontSize = 12.sp,
                                  fontWeight = FontWeight.Bold,
                                  modifier = Modifier.padding(horizontal = 12.dp, vertical = 6.dp)
                              )
                          }
                      }
                  }

                  HeroActionCard(
                      title = strings.sendButtonTitle,
                      subtitle = strings.sendButtonSubtitle,
                      icon = Icons.Default.Upload,
                      gradient = AppBranding.SendCardGradient,
                      onClick = onSendClick
                  )

                  HeroActionCard(
                      title = strings.receiveButtonTitle,
                      subtitle = strings.receiveButtonSubtitle,
                      icon = Icons.Default.Download,
                      gradient = AppBranding.ReceiveCardGradient,
                      onClick = onReceiveClick
                  )

                  OutlinedCard(
                      onClick = onNearbyClick,
                      shape = RoundedCornerShape(20.dp),
                      modifier = Modifier.fillMaxWidth()
                  ) {
                      Row(
                          modifier = Modifier
                              .fillMaxWidth()
                              .padding(18.dp),
                          verticalAlignment = Alignment.CenterVertically
                      ) {
                          Box(
                              modifier = Modifier
                                  .size(48.dp)
                                  .clip(RoundedCornerShape(14.dp))
                                  .background(MaterialTheme.colorScheme.primaryContainer),
                              contentAlignment = Alignment.Center
                          ) {
                              Icon(
                                  imageVector = Icons.Default.QrCodeScanner,
                                  contentDescription = null,
                                  tint = MaterialTheme.colorScheme.onPrimaryContainer
                              )
                          }
                          Spacer(modifier = Modifier.width(16.dp))
                          Column(modifier = Modifier.weight(1f)) {
                              Text(
                                  text = strings.quickQrPair,
                                  fontWeight = FontWeight.Bold,
                                  fontSize = 16.sp
                              )
                              Text(
                                  text = strings.securityBadgeText,
                                  fontSize = 12.sp,
                                  color = MaterialTheme.colorScheme.onSurfaceVariant
                              )
                          }
                          Icon(
                              imageVector = Icons.Default.ChevronRight,
                              contentDescription = null
